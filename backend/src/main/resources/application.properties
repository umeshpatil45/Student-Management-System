# ==========================================================
# Spring Boot Configuration - Student Management System
# ==========================================================

spring.application.name=student-management-system

# Server Port
server.port=${PORT:8080}

# ==========================================================
# MySQL Database Configuration
# Supports environment variable overrides for cloud or container deployment
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# JWT Security Configuration
# Environment variable overrides supported for JWT_SECRET & JWT_EXPIRATION_MS
# ==========================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
