<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <!-- Logo & Header -->
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3>Student Management</h3>
            <p>Sign in to access your administrative dashboard</p>
        </div>

        <!-- Error/Success Alert Box -->
        <div id="authAlert" class="alert alert-danger d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="authAlertText"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="loginUsername" class="form-label">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control" id="loginUsername" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <div class="password-input-group">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility">
                        <i class="bi bi-eye" id="passwordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Demo Credentials Helper Pill -->
            <div class="p-2 mb-3 bg-light rounded border text-muted small d-flex justify-content-between align-items-center">
                <div>
                    <strong>Demo Admin:</strong> <code>admin</code> / <code>Admin@123</code>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" id="fillDemoBtn" style="font-size: 0.75rem;">
                    Fill
                </button>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2" id="btnLoginSubmit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <!-- Register Modal Trigger -->
        <div class="text-center mt-3 pt-2 border-top">
            <span class="text-muted small">Need an account?</span>
            <button type="button" class="btn btn-link btn-sm text-decoration-none fw-semibold" data-bs-toggle="modal" data-bs-target="#registerModal">
                Register Admin
            </button>
        </div>
    </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 14px;">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold" id="registerModalLabel">
                    <i class="bi bi-person-plus text-primary me-2"></i>Create New Account
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-3">
                <div id="registerAlert" class="alert alert-danger d-none" role="alert">
                    <span id="registerAlertText"></span>
                </div>
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="regUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="regUsername" required minlength="3" placeholder="Choose a unique username">
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="regEmail" required placeholder="name@institution.com">
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="regPassword" required minlength="6" placeholder="At least 6 characters">
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2" id="btnRegisterSubmit">
                        Register Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Application Scripts -->
<script src="js/auth.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // If already authenticated, jump to dashboard
        redirectIfAuth();

        const loginForm = document.getElementById("loginForm");
        const loginUsername = document.getElementById("loginUsername");
        const loginPassword = document.getElementById("loginPassword");
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const passwordIcon = document.getElementById("passwordIcon");
        const authAlert = document.getElementById("authAlert");
        const authAlertText = document.getElementById("authAlertText");
        const btnSubmit = document.getElementById("btnLoginSubmit");
        const fillDemoBtn = document.getElementById("fillDemoBtn");

        // Toggle show/hide password
        toggleBtn.addEventListener("click", () => {
            const isPassword = loginPassword.type === "password";
            loginPassword.type = isPassword ? "text" : "password";
            passwordIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
        });

        // Quick demo fill
        fillDemoBtn.addEventListener("click", () => {
            loginUsername.value = "admin";
            loginPassword.value = "Admin@123";
        });

        // Handle Login Submission
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            authAlert.classList.add("d-none");

            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            if (!username || !password) {
                authAlertText.textContent = "Please enter both username and password.";
                authAlert.classList.remove("d-none");
                return;
            }

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Invalid username or password.");
                }

                // Save auth & JWT
                saveAuth(data);
                showToast("Login successful! Redirecting...", "success");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 600);

            } catch (error) {
                authAlertText.textContent = error.message || "Failed to login. Please try again.";
                authAlert.classList.remove("d-none");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
            }
        });

        // Handle Register Submission
        const registerForm = document.getElementById("registerForm");
        const regAlert = document.getElementById("registerAlert");
        const regAlertText = document.getElementById("registerAlertText");
        const btnRegSubmit = document.getElementById("btnRegisterSubmit");

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            regAlert.classList.add("d-none");

            const username = document.getElementById("regUsername").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;

            if (!username || !email || !password) {
                regAlertText.textContent = "All fields are required.";
                regAlert.classList.remove("d-none");
                return;
            }

            try {
                btnRegSubmit.disabled = true;
                btnRegSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';

                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ username, email, password, role: "ROLE_ADMIN" })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed. Try a different username/email.");
                }

                saveAuth(data);
                showToast("Account registered! Redirecting...", "success");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 600);

            } catch (error) {
                regAlertText.textContent = error.message || "Registration failed.";
                regAlert.classList.remove("d-none");
            } finally {
                btnRegSubmit.disabled = false;
                btnRegSubmit.innerHTML = 'Register Account';
            }
        });
    });
</script>
</body>
</html>
