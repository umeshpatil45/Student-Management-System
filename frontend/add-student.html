<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
        <a href="dashboard.html" class="sidebar-brand">
            <i class="bi bi-mortarboard-fill"></i>
            <span>SMS Portal</span>
        </a>

        <ul class="sidebar-menu">
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="students.html" class="sidebar-link">
                    <i class="bi bi-people-fill"></i>
                    <span>Students</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="add-student.html" class="sidebar-link active">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Add Student</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="profile.html" class="sidebar-link">
                    <i class="bi bi-person-badge-fill"></i>
                    <span>Profile</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="#" class="sidebar-link text-danger btn-logout-action">
                <i class="bi bi-box-arrow-left"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
        <!-- Top Navbar -->
        <header class="app-navbar">
            <div class="navbar-left">
                <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle Navigation">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">Add New Student</h1>
            </div>

            <div class="navbar-right">
                <div class="user-profile-badge">
                    <div class="user-avatar">A</div>
                    <span class="user-name-text">Administrator</span>
                </div>
                <button class="btn-nav-logout btn-logout-action" title="Log out">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-sm-inline">Logout</span>
                </button>
            </div>
        </header>

        <!-- Main Body -->
        <main class="app-content">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <!-- Form Card -->
                    <div class="content-card">
                        <div class="content-card-header">
                            <h3 class="content-card-title">
                                <i class="bi bi-person-plus-fill text-primary"></i>
                                Student Registration Form
                            </h3>
                            <a href="students.html" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Back to List
                            </a>
                        </div>

                        <div class="content-card-body p-4">
                            <form id="addStudentForm" novalidate>
                                <div class="row g-3">
                                    <!-- Full Name -->
                                    <div class="col-12 col-md-6">
                                        <label for="studentName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                            <input type="text" class="form-control" id="studentName" placeholder="e.g. John Doe" required autofocus>
                                        </div>
                                    </div>

                                    <!-- Email -->
                                    <div class="col-12 col-md-6">
                                        <label for="studentEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                            <input type="email" class="form-control" id="studentEmail" placeholder="e.g. john.doe@university.edu" required>
                                        </div>
                                    </div>

                                    <!-- Phone Number -->
                                    <div class="col-12 col-md-6">
                                        <label for="studentPhone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-telephone text-muted"></i></span>
                                            <input type="tel" class="form-control" id="studentPhone" placeholder="e.g. +1-555-0199" required>
                                        </div>
                                    </div>

                                    <!-- Status -->
                                    <div class="col-12 col-md-6">
                                        <label for="studentStatus" class="form-label">Enrollment Status</label>
                                        <select class="form-select" id="studentStatus">
                                            <option value="Active" selected>Active</option>
                                            <option value="Inactive">Inactive</option>
                                        </select>
                                    </div>

                                    <!-- Department -->
                                    <div class="col-12 col-md-6">
                                        <label for="studentDepartment" class="form-label">Department <span class="text-danger">*</span></label>
                                        <select class="form-select" id="studentDepartment" required>
                                            <option value="" disabled selected>Select Department</option>
                                            <option value="Computer Science">Computer Science</option>
                                            <option value="Information Technology">Information Technology</option>
                                            <option value="Electrical Engineering">Electrical Engineering</option>
                                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                                            <option value="Civil Engineering">Civil Engineering</option>
                                            <option value="Business Administration">Business Administration</option>
                                        </select>
                                    </div>

                                    <!-- Academic Year -->
                                    <div class="col-12 col-md-6">
                                        <label for="studentYear" class="form-label">Academic Year <span class="text-danger">*</span></label>
                                        <select class="form-select" id="studentYear" required>
                                            <option value="" disabled selected>Select Year</option>
                                            <option value="1st Year">1st Year</option>
                                            <option value="2nd Year">2nd Year</option>
                                            <option value="3rd Year">3rd Year</option>
                                            <option value="4th Year">4th Year</option>
                                        </select>
                                    </div>

                                    <!-- Course -->
                                    <div class="col-12">
                                        <label for="studentCourse" class="form-label">Course / Degree Program <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-journal-bookmark text-muted"></i></span>
                                            <input type="text" class="form-control" id="studentCourse" placeholder="e.g. B.Sc in Computer Science" required>
                                        </div>
                                    </div>

                                    <!-- Residential Address -->
                                    <div class="col-12">
                                        <label for="studentAddress" class="form-label">Residential Address <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="studentAddress" rows="3" placeholder="Enter full permanent or residential address" required></textarea>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                                    <a href="students.html" class="btn btn-secondary-custom">
                                        Cancel
                                    </a>
                                    <button type="submit" class="btn btn-primary-custom" id="btnAddStudentSubmit">
                                        <i class="bi bi-person-plus me-1"></i> Add Student
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Application Scripts -->
<script src="js/auth.js"></script>
<script src="js/add-student.js"></script>
</body>
</html>
